<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Budget+</title></head><body><div class="app"><header><div><b>Budget<span>+</span></b><small>Ton budget, simplement.</small></div><button id="theme">☀️</button></header><main><section class="hero"><label>Mois <input id="month" type="month"></label><div class="balance"><small>Reste à gérer</small><strong id="remaining">0 FCFA</strong><span id="spent">0 FCFA dépensés</span></div></section><section class="grid"><div class="card"><b>💰 Revenus</b><input id="income" type="number" placeholder="0"></div><div class="card"><b>🏦 Épargne</b><input id="saving" type="number" placeholder="0"></div><div class="card"><b>🎓 École</b><input id="school" type="number" placeholder="0"></div><div class="card"><b>👛 Poche</b><input id="pocket" type="number" placeholder="0"></div></section><section class="card"><h2>Répartition</h2><p>Épargne : <b id="sv">0 FCFA</b></p><p>École : <b id="scv">0 FCFA</b></p><p>Poche : <b id="pv">0 FCFA</b></p><hr><p><b>Total prévu : <span id="planned">0 FCFA</span></b></p></section><button class="primary" id="add">＋ Ajouter une dépense</button><section class="card"><h2>Dépenses récentes</h2><div id="list">Aucune dépense.</div></section><section class="card"><h2>Objectif d'épargne</h2><input id="goal" type="number" placeholder="Objectif FCFA"><button id="goalBtn">Enregistrer</button><div class="progress"><i id="bar"></i></div><small id="goalText"></small></section><section class="card"><h2>Statistiques</h2><div id="stats">Aucune dépense.</div></section></main><nav><button>⌂<small>Accueil</small></button><button id="navExp">▣<small>Dépenses</small></button><button id="navBud">◈<small>Budget</small></button><button id="export">⇩<small>Exporter</small></button></nav></div><div id="modal" class="modal hidden"><div class="modalbox"><h2>Ajouter une dépense <button id="close">×</button></h2><input id="label" placeholder="Ex. Courses"><input id="amount" type="number" placeholder="Montant"><select id="cat"><option>Alimentation</option><option>Transport</option><option>Maison</option><option>École</option><option>Loisirs</option><option>Santé</option><option>Autre</option></select><button class="primary" id="save">Enregistrer</button></div></div><script src="app.js"></script></body></html>
